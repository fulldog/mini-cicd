# 复制到业务仓库根目录，改名为 .woodpecker.yaml，
# 并把 mini-cicd 的 deploy-remote.sh 拷进该仓库（或改成 CI 机上的绝对路径）。
#
# Secrets（必填）：deploy_host、deploy_user、ssh_private_key

when:
  - event: [push, manual]
    branch: [main, master]

steps:
  - name: build
    image: bash
    commands:
      # 不要在流水线里 apk/apt 装编译器；用 CI 机已装的 go/node。
      # 模块与 toolchain 缓存在宿主机 /var/cache/woodpecker（由 mini-cicd agent 注入）。
      - echo "换成该仓库的打包命令，例如：go build -o myapp . 或 pnpm build"
      - echo "下面 PUBLISH_SRC 改成实际产物路径"

  - name: publish
    image: bash
    environment:
      DEPLOY_HOST:
        from_secret: deploy_host
      DEPLOY_USER:
        from_secret: deploy_user
      SSH_PRIVATE_KEY:
        from_secret: ssh_private_key
      DEPLOY_PATH: /opt/app
      PUBLISH_SRC: dist
      # PUBLISH_DEST: dist
      # REMOTE_AFTER: sudo -n systemctl restart myapp
      # DEPLOY_HEALTH_URL: https://example.com/health
    commands:
      - bash deploy-remote.sh
